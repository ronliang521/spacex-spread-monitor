# Cloudflare Workers + static assets (same origin as /api/*).
# Deploy from repo root: npm install && npx wrangler deploy
name = "spacex-spread-monitor"
main = "cloudflare/src/index.ts"
compatibility_date = "2025-05-12"
compatibility_flags = ["nodejs_compat_v2"]

[assets]
directory = "cloudflare/public"
binding = "ASSETS"

[browser]
binding = "BROWSER"

# 可选：Cloudflare Worker 将 /api/candles（Gate+remote）反向代理到自建 FastAPI（失败时回退 Worker 内联 REST）。
# wrangler secret put BACKEND_ORIGIN
# 例：https://your-tunnel.example.com
